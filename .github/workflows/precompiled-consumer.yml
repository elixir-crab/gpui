name: Validate precompiled consumers

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Untagged Build precompiled NIFs run to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: No-Cargo consumer (${{ matrix.target }}, ${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            host: vanilla
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            host: gpui_component
          - os: macos-14
            target: aarch64-apple-darwin
            host: vanilla
          - os: macos-14
            target: aarch64-apple-darwin
            host: gpui_component
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            host: vanilla
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            host: gpui_component
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MIX_ENV: release
      GPUI_SKIP_NATIVE: "1"
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Download untagged host archives
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          path: precompiled-artifacts
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: precompiled-consumer-rc2-${{ matrix.target }}-${{ matrix.host }}
          restore-plt-cache: "false"
      - name: Install native runtime dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon0 libxkbcommon-x11-0
      - name: Stage untagged archive and checksum
        if: inputs.run_id != ''
        env:
          ARCHIVE_ROOT: ${{ github.workspace }}/precompiled-artifacts
          TARGET: ${{ matrix.target }}
          HOST: ${{ matrix.host }}
          RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: ${{ github.workspace }}/.precompiled-cache
        run: mix do compile --force, gpui.test.precompiled.stage
      - run: mix gpui.test.precompiled --host ${{ matrix.host }}
        env:
          RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: ${{ github.workspace }}/.precompiled-cache
