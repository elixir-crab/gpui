name: Validate precompiled consumers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: No-Cargo consumer (${{ matrix.target }}, ${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            host: vanilla
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            host: gpui_component
          - os: macos-14
            target: aarch64-apple-darwin
            host: vanilla
          - os: macos-14
            target: aarch64-apple-darwin
            host: gpui_component
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            host: vanilla
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            host: gpui_component
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MIX_ENV: release
      GPUI_SKIP_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Disable Unix Rust wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV 'CARGO_BUILD_RUSTC_WRAPPER='
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: precompiled-consumer-v2-${{ matrix.target }}-${{ matrix.host }}
          restore-plt-cache: "false"
      - name: Install native runtime dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon0 libxkbcommon-x11-0
      - run: mix gpui.test.precompiled --host ${{ matrix.host }}
