name: Build precompiled NIFs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build_release:
    name: NIF 2.15 - x86_64 Linux (${{ matrix.host }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: vanilla
            cargo_features: vanilla-host
          - host: gpui-component
            cargo_features: gpui-component-host
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libxkbcommon-x11-dev

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustler-precompiled
          shared-key: x86_64-unknown-linux-gnu-2.15-${{ matrix.host }}

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(grep -m1 -E '^  @version "[^"]+"' apps/gpui_native/mix.exs | cut -d'"' -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build host archive
        id: build
        uses: philss/rustler-precompiled-action@v1.1.4
        env:
          RUST_FONTCONFIG_DLOPEN: "1"
        with:
          project-name: gpui_nif
          project-version: ${{ steps.version.outputs.version }}
          project-dir: .
          target: x86_64-unknown-linux-gnu
          nif-version: "2.15"
          variant: ${{ matrix.host }}
          cargo-args: >-
            --locked --manifest-path Cargo.toml
            --package gpui_nif --no-default-features
            --features ${{ matrix.cargo_features }}

      - name: Attest host archive
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build.outputs.file-path }}

      - name: Upload host archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}

      - name: Publish host archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.file-path }}

  checksum:
    name: Generate RustlerPrecompiled checksums
    if: startsWith(github.ref, 'refs/tags/')
    needs: build_release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          restore-plt-cache: "false"

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libxkbcommon-x11-dev

      - name: Prepare RustlerPrecompiled metadata
        env:
          GPUI_BUILD_FROM_SOURCE: "1"
          RUST_FONTCONFIG_DLOPEN: "1"
        run: mix compile

      - name: Generate verified checksum manifest
        working-directory: apps/gpui_native
        run: mix rustler_precompiled.download GPUI.Native.NIF --all --print

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: rustler-precompiled-checksum
          path: apps/gpui_native/checksum-Elixir.GPUI.Native.NIF.exs

      - name: Publish checksum manifest
        uses: softprops/action-gh-release@v2
        with:
          files: apps/gpui_native/checksum-Elixir.GPUI.Native.NIF.exs
