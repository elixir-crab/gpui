name: Build precompiled NIFs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build_release:
    uses: elixir-vibe/actions/.github/workflows/elixir-rustler-release.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      project-name: gpui_nif
      project-dir: native/gpui
      jobs: >-
        [
          {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","use-cross":false}
        ]
      apt-packages: libxkbcommon-dev libxkbcommon-x11-dev
      extra-env: |
        RUST_FONTCONFIG_DLOPEN=1
      attest-artifacts: true
      checksum-module: GPUI.Native
      checksum-file: checksum-Elixir.GPUI.Native.exs
      checksum-prepare-command: GPUI_BUILD_FROM_SOURCE=1 mix compile
      timeout-minutes: 60
