name: Build precompiled NIFs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build_release:
    name: NIF 2.15 - ${{ matrix.target }} (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            host: vanilla
            cargo_features: vanilla-host
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            host: gpui-component
            cargo_features: gpui-component-host
          - target: aarch64-apple-darwin
            os: macos-14
            host: vanilla
            cargo_features: vanilla-host
          - target: aarch64-apple-darwin
            os: macos-14
            host: gpui-component
            cargo_features: gpui-component-host
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            host: vanilla
            cargo_features: vanilla-host
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            host: gpui-component
            cargo_features: gpui-component-host
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          target: ${{ matrix.target }}

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libxkbcommon-x11-dev

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustler-precompiled
          shared-key: ${{ matrix.target }}-2.15-${{ matrix.host }}

      - name: Set up Elixir for release metadata
        uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          deps-command: "true"
          restore-plt-cache: "false"

      - name: Read package version
        id: version
        working-directory: dev/release_tools
        run: mix gpui.release.version.show --package gpui_native --github-output

      - name: Build host archive
        id: build
        uses: philss/rustler-precompiled-action@v1.1.4
        env:
          CARGO_BUILD_RUSTC_WRAPPER: ""
          RUST_FONTCONFIG_DLOPEN: "1"
        with:
          project-name: gpui_nif
          project-version: ${{ steps.version.outputs.version }}
          project-dir: .
          target: ${{ matrix.target }}
          nif-version: "2.15"
          use-cross: ${{ matrix.use-cross }}
          variant: ${{ matrix.host }}
          cargo-args: >-
            --locked --manifest-path Cargo.toml
            --package gpui_nif --no-default-features
            --features ${{ matrix.cargo_features }}

      - name: Verify release archive name
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOST: ${{ matrix.host }}
          TARGET: ${{ matrix.target }}
          FILE_NAME: ${{ steps.build.outputs.file-name }}
        run: |
          case "$TARGET" in
            *-pc-windows-*) prefix=""; extension="dll" ;;
            *) prefix="lib"; extension="so" ;;
          esac
          expected="${prefix}gpui_nif-v${VERSION}-nif-2.15-${TARGET}--${HOST}.${extension}.tar.gz"
          test "$FILE_NAME" = "$expected"

      - name: Set up Elixir for compatibility check
        uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          deps-command: "true"
          restore-plt-cache: "false"

      - name: Verify GLIBC compatibility ceiling
        if: runner.os == 'Linux'
        working-directory: dev/release_tools
        env:
          ARCHIVE: ${{ github.workspace }}/${{ steps.build.outputs.file-path }}
        run: >-
          mix gpui.release.glibc.check
          --archive "$ARCHIVE"
          --max-version 2.35

      - name: Verify macOS archive architecture and linkage
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCHIVE: ${{ steps.build.outputs.file-path }}
        run: |
          set -euo pipefail
          directory="$(mktemp -d)"
          tar -xzf "$ARCHIVE" -C "$directory"
          library="$(find "$directory" -type f -name '*.so' -print -quit)"
          test -n "$library"
          file "$library" | grep -q 'arm64'
          otool -L "$library"

      - name: Verify Windows archive architecture and dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.build.outputs.file-path }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory $directory | Out-Null
          tar -xzf $env:ARCHIVE -C $directory
          $library = Get-ChildItem $directory -Filter *.dll | Select-Object -First 1 -ExpandProperty FullName
          if (-not $library) { throw "archive contains no DLL" }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          $headers = & $dumpbin.Source /headers $library
          if ($headers -notmatch "8664 machine \(x64\)") { throw "DLL is not x86-64" }
          & $dumpbin.Source /dependents $library

      - name: Attest host archive
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build.outputs.file-path }}

      - name: Upload host archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}

      - name: Publish host archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: false
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.file-path }}

  checksum:
    name: Generate RustlerPrecompiled checksums
    if: startsWith(github.ref, 'refs/tags/')
    needs: build_release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          restore-plt-cache: "false"

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libxkbcommon-x11-dev

      - name: Prepare RustlerPrecompiled metadata
        env:
          GPUI_BUILD_FROM_SOURCE: "1"
          RUST_FONTCONFIG_DLOPEN: "1"
        run: mix compile

      - name: Generate verified checksum manifest
        working-directory: apps/gpui_native
        run: mix rustler_precompiled.download GPUI.Native.NIF --all --print

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: rustler-precompiled-checksum
          path: apps/gpui_native/checksum-Elixir.GPUI.Native.NIF.exs

      - name: Prepare canonical release notes
        working-directory: dev/release_tools
        run: >-
          mix gpui.release.changelog.extract
          --changelog ../../CHANGELOG.md
          --version "${{ needs.build_release.outputs.version }}"
          --output ../../release-notes.md

      - name: Publish checksum and canonical release metadata
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build_release.outputs.version }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.build_release.outputs.prerelease }}
          make_latest: false
          body_path: release-notes.md
          files: apps/gpui_native/checksum-Elixir.GPUI.Native.NIF.exs
