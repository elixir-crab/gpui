name: Precompiled NIF

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  RUST_FONTCONFIG_DLOPEN: "1"

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - name: Read and validate project version
        shell: bash
        run: |
          version=$(mix run --no-compile --no-deps-check -e 'IO.write(Mix.Project.config()[:version])')
          if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build precompiled NIF
        id: build
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: gpui_nif
          project-version: ${{ env.PROJECT_VERSION }}
          target: x86_64-unknown-linux-gnu
          nif-version: "2.15"
          project-dir: native/gpui
      - uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build.outputs.file-path }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}
      - name: Attach artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.file-path }}

  checksum:
    if: startsWith(github.ref, 'refs/tags/')
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - run: mix deps.get
      - name: Generate verified checksum manifest
        env:
          GPUI_BUILD_FROM_SOURCE: "1"
        run: |
          mix compile
          mix rustler_precompiled.download GPUI.Native --all --print
      - uses: actions/upload-artifact@v7
        with:
          name: gpui-nif-checksum
          path: checksum-Elixir.GPUI.Native.exs
      - name: Attach checksum to tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: checksum-Elixir.GPUI.Native.exs
