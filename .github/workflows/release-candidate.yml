name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: test
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: release-candidate-quality-v2
      - name: Install quality dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          inotify-tools libxkbcommon-dev libxkbcommon-x11-dev
      - run: mix ci.checks
      - run: mix gpui.test.codegen

  native-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: e2e
      RUST_FONTCONFIG_DLOPEN: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: release-candidate-e2e-v2
          restore-plt-cache: "false"
      - name: Install native E2E dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          dbus-x11 libvulkan1 libxkbcommon-dev libxkbcommon-x11-dev
          mesa-vulkan-drivers vulkan-tools xdotool xvfb
      - name: Verify Lavapipe under Xvfb
        run: xvfb-run -a vulkaninfo --summary
      - name: Run native E2E suite
        run: mix gpui.test.e2e

  macos-native:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GPUI_BUILD_FROM_SOURCE: "1"
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: release-candidate-macos-v2
          restore-plt-cache: "false"
      - name: Select full Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Build native NIF from source
        run: mix compile --force --warnings-as-errors
      - name: Run native boundary tests
        run: mix test test/gpui/native_test.exs test/gpui/image_test.exs

  release-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: release
      GPUI_BUILD_FROM_SOURCE: "1"
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: release-candidate-package-v2
          restore-plt-cache: "false"
      - name: Install Rust security audit
        run: cargo install cargo-audit --locked
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libxkbcommon-x11-dev
      - run: mix gpui.test.hosts
      - run: mix gpui.release.check
