name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: test
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: release-candidate-quality
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libxkbcommon-x11-dev
      - run: mix ci

  native-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: e2e
      RUST_FONTCONFIG_DLOPEN: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: release-candidate-e2e
          restore-plt-cache: "false"
      - name: Install native E2E dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          dbus-x11 libvulkan1 libxkbcommon-dev libxkbcommon-x11-dev
          mesa-vulkan-drivers vulkan-tools xdotool xvfb
      - name: Verify Lavapipe under Xvfb
        run: xvfb-run -a vulkaninfo --summary
      - name: Run isolated native ExUnit groups
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          run_group() {
            local name="$1"
            shift
            echo "::group::Native E2E: ${name}"
            if ! xvfb-run -a dbus-run-session -- mix test --only e2e "$@"; then
              failures=1
            fi
            echo "::endgroup::"
          }

          run_group "rich text and transcript" \
            apps/gpui_native/test/e2e/gpui/native/rich_text_test.exs \
            apps/gpui_native/test/e2e/gpui/native/rich_transcript_test.exs \
            apps/gpui_native/test/e2e/gpui/native/composer_transcript_test.exs \
            apps/gpui_native/test/e2e/gpui/native/virtual_collection_test.exs
          run_group "editable text" \
            apps/gpui_native/test/e2e/gpui/native/text_surface_test.exs \
            apps/gpui_native/test/e2e/gpui/native/text_style_run_test.exs
          run_group "overlays and topology" \
            apps/gpui_native/test/e2e/gpui/native/overlay_test.exs \
            apps/gpui_native/test/e2e/gpui/native/multi_window_topology_test.exs
          run_group "remote display" apps/gpui_native/test/e2e/gpui/remote
          run_group "native controls and examples" \
            apps/gpui_native/test/e2e/gpui/native/code_viewer_test.exs \
            apps/gpui_native/test/e2e/gpui/native/components_test.exs \
            apps/gpui_native/test/e2e/gpui/native/data_table_test.exs \
            apps/gpui_native/test/e2e/gpui/native/display_controls_test.exs \
            apps/gpui_native/test/e2e/gpui/native/elixir_workbench_log_source_test.exs \
            apps/gpui_native/test/e2e/gpui/native/elixir_workbench_repository_source_test.exs \
            apps/gpui_native/test/e2e/gpui/native/form_controls_test.exs \
            apps/gpui_native/test/e2e/gpui/native/image_palette_test.exs \
            apps/gpui_native/test/e2e/gpui/native/interactivity_test.exs \
            apps/gpui_native/test/e2e/gpui/native/lifecycle_test.exs \
            apps/gpui_native/test/e2e/gpui/native/split_test.exs \
            apps/gpui_native/test/e2e/gpui/native/tree_test.exs \
            apps/gpui_native/test/e2e/gpui/native/virtual_list_test.exs

          exit "$failures"

  macos-native:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GPUI_BUILD_FROM_SOURCE: "1"
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: release-candidate-macos
          restore-plt-cache: "false"
      - name: Select full Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Build native NIF from source
        run: mix compile --force --warnings-as-errors
      - name: Run native boundary tests
        run: mix test test/gpui/native_test.exs test/gpui/image_test.exs

  release-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: release
      GPUI_BUILD_FROM_SOURCE: "1"
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: release-candidate-package
          restore-plt-cache: "false"
      - name: Install Rust security audit
        run: cargo install cargo-audit --locked
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libxkbcommon-x11-dev
      - run: mix gpui.test.hosts
      - run: mix gpui.release.check
