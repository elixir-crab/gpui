name: Native quality

on:
  push:
    branches: [main, clean-architecture]
    paths:
      - "native/**"
      - "codegen/**"
      - "apps/gpui_native/test/e2e/**"
      - "test/support/desktop/**"
      - "apps/gpui/lib/gpui/native.ex"
      - "apps/gpui_native/lib/gpui/display_native.ex"
      - "apps/gpui/lib/gpui/runtime.ex"
      - "apps/gpui/lib/gpui/session.ex"
      - "dev/mix/tasks/gpui.test.native.ex"
      - "dev/mix/tasks/gpui.test.mode_switch.ex"
      - "rust-toolchain.toml"
      - "rustq.exs"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "codegen/**"
      - "apps/gpui_native/test/e2e/**"
      - "test/support/desktop/**"
      - "apps/gpui/lib/gpui/native.ex"
      - "apps/gpui_native/lib/gpui/display_native.ex"
      - "apps/gpui/lib/gpui/runtime.ex"
      - "apps/gpui/lib/gpui/session.ex"
      - "dev/mix/tasks/gpui.test.native.ex"
      - "dev/mix/tasks/gpui.test.mode_switch.ex"
      - "rust-toolchain.toml"
      - "rustq.exs"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/native.yml"
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: Save a fresh native dependency cache after validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mode-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: mode-switch-linux
      - name: Restore native dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux
          workspaces: . -> target
          save-if: false
      - name: Install native desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          dbus-x11 libgl1-mesa-dri libxkbcommon-dev libxkbcommon-x11-dev
          mesa-vulkan-drivers xdotool xvfb
      - run: mix deps.get
      - run: mix gpui.test.mode_switch

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: native-quality
      - name: Restore stable native dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux
          workspaces: . -> target
          save-if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_cache }}
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libxkbcommon-x11-dev
      - run: mix ci.native
