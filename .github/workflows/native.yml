name: Native quality

on:
  push:
    branches: [main, clean-architecture]
    paths:
      - "native/**"
      - "codegen/**"
      - "test/e2e/**"
      - "test/support/e2e/**"
      - "test/support/e2e_driver/**"
      - "lib/gpui/native.ex"
      - "lib/gpui/display/native.ex"
      - "lib/gpui/runtime.ex"
      - "lib/gpui/session.ex"
      - "rust-toolchain.toml"
      - "rustq.exs"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "codegen/**"
      - "test/e2e/**"
      - "test/support/e2e/**"
      - "test/support/e2e_driver/**"
      - "lib/gpui/native.ex"
      - "lib/gpui/display/native.ex"
      - "lib/gpui/runtime.ex"
      - "lib/gpui/session.ex"
      - "rust-toolchain.toml"
      - "rustq.exs"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: elixir-vibe/actions/.github/workflows/elixir-rustler-ci.yml@v1
    with:
      latest-elixir: "1.20.2"
      latest-otp: "29.0.2"
      latest-command: mix ci.native
      run-min: false
      rust-toolchain: "1.95.0"
      apt-packages: libxkbcommon-dev libxkbcommon-x11-dev
      extra-env: |
        RUST_FONTCONFIG_DLOPEN=1
      restore-rust-cache: false
      timeout-minutes: 30
