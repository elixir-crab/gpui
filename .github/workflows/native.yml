name: Native validation

on:
  push:
    branches: [main, clean-architecture]
    paths:
      - "native/**"
      - "codegen/**"
      - "test/e2e/**"
      - "test/support/e2e/**"
      - "test/support/e2e_driver/**"
      - "lib/gpui/native.ex"
      - "lib/gpui/display/native.ex"
      - "lib/gpui/runtime.ex"
      - "lib/gpui/session.ex"
      - "rust-toolchain.toml"
      - "rustq.exs"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/native.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-audit
      - run: cargo install cargo-audit --locked
      - run: >-
          cargo audit --file native/gpui/Cargo.lock
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195

  native-quality:
    uses: elixir-vibe/actions/.github/workflows/elixir-rustler-ci.yml@v1
    with:
      latest-elixir: "1.20.2"
      latest-otp: "29.0.2"
      latest-command: mix ci_native
      run-min: false
      rust-toolchain: "1.95.0"
      apt-packages: libxkbcommon-dev libxkbcommon-x11-dev
      extra-env: |
        RUST_FONTCONFIG_DLOPEN=1
      rust-cache-workspaces: |
        native/gpui -> target
        test/support/e2e_driver -> target
      timeout-minutes: 45

  native-e2e:
    needs: native-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIX_ENV: e2e
      RUST_FONTCONFIG_DLOPEN: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: native-e2e
          restore-plt-cache: "false"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-e2e
          workspaces: |
            native/gpui -> target
            test/support/e2e_driver -> target
      - name: Install native E2E dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          dbus-x11 libvulkan1 libxkbcommon-dev libxkbcommon-x11-dev
          mesa-vulkan-drivers vulkan-tools xdotool xvfb
      - name: Verify Lavapipe under Xvfb
        run: xvfb-run -a vulkaninfo --summary
      - name: Run native ExUnit suite
        run: >-
          xvfb-run -a dbus-run-session --
          mix test --only e2e test/e2e

  macos-native:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GPUI_BUILD_FROM_SOURCE: "1"
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: macos-native
          restore-plt-cache: "false"
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-native
          workspaces: native/gpui -> target
      - name: Select full Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Build native NIF from source
        run: mix compile --force --warnings-as-errors
      - name: Run native boundary tests
        run: mix test test/gpui/native_test.exs test/gpui/image_test.exs
