name: CI

on:
  push:
    branches: [main, clean-architecture]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
      GPUI_SKIP_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: checks-rc2
          restore-plt-cache: "false"
      - name: Install file watcher dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends inotify-tools
      - run: mix ci.checks
