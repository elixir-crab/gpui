name: CI

on:
  push:
    branches: [main, clean-architecture]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    uses: elixir-vibe/actions/.github/workflows/elixir-rustler-ci.yml@v1
    with:
      latest-elixir: "1.20.2"
      latest-otp: "29.0.2"
      latest-command: mix ci_fast
      run-min: false
      rust-toolchain: "1.95.0"
      rust-components: ""
      extra-env: |
        RUST_FONTCONFIG_DLOPEN=1
      rust-cache-workspaces: native/gpui -> target
      restore-plt-cache: false
      timeout-minutes: 15

  rustq-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: dev
      ERL_FLAGS: "+S 4:4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          cache-prefix: rustq-codegen
          restore-plt-cache: "false"
      - uses: Swatinem/rust-cache@v2
        with:
          key: rustq-codegen
          workspaces: deps/rustq/native/rustq_nif -> target
      - run: mix rustq.gen --check
