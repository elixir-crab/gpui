name: CI

on:
  push:
    branches: [main, clean-architecture]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  RUST_FONTCONFIG_DLOPEN: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - run: mix deps.get
      - run: mix ci

  native-e2e:
    runs-on: ubuntu-24.04
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native E2E dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          dbus-x11 libxkbcommon-dev libxkbcommon-x11-dev
          mesa-vulkan-drivers xdotool xvfb
      - run: mix deps.get
      - run: mix test_e2e

  release-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - run: mix deps.get
      - run: mix gpui.release.check
