[package]
name = "gpui_nif"
version = "0.1.0-rc.1"
edition = "2021"
publish = false

[lib]
name = "gpui_nif"
crate-type = ["cdylib"]

[features]
default = ["components"]
real-gpui = ["dep:zed_gpui", "dep:gpui_platform", "dep:image", "dep:futures", "dep:unicode-segmentation"]
desktop = ["real-gpui", "gpui_platform/font-kit", "gpui_platform/wayland", "gpui_platform/x11"]
components = ["desktop", "dep:gpui-component", "dep:gpui-component-assets"]

[dependencies]
rustler = "0.38.0"
# gpui-component uses the unqualified Zed source. Keep these source IDs identical
# and pin the shared revision through Cargo.lock so all GPUI types are unified.
zed_gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "3c270ed2", optional = true }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "3c270ed2", optional = true }
image = { version = "0.25.10", optional = true }
futures = { version = "0.3", optional = true }
unicode-segmentation = { version = "1.12", optional = true }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
