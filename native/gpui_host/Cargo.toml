[package]
name = "gpui_host"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
real-gpui = ["dep:gpui", "dep:gpui_platform"]

[dependencies]
eetf = "0.12.0"
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["wayland", "x11"], optional = true }
