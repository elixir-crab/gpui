[package]
name = "gpui_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gpui_native"
crate-type = ["cdylib"]

[features]
default = []
real-gpui = ["dep:gpui", "dep:gpui_platform", "dep:image", "dep:futures", "dep:unicode-segmentation"]

[dependencies]
rustler = "0.38.0"
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit", "wayland", "x11"], optional = true }
image = { version = "0.25.10", optional = true }
futures = { version = "0.3", optional = true }
unicode-segmentation = { version = "1.12", optional = true }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
