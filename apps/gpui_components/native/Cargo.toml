[package]
name = "gpui_components"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
native-render = ["dep:zed_gpui", "gpui_core/native-render"]

[lib]
name = "gpui_components"
crate-type = ["rlib"]

[dependencies]
gpui_core = { path = "../../gpui/native" }
zed_gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", optional = true }
