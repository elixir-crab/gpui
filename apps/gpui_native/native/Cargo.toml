[package]
name = "gpui_nif"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "gpui_nif"
crate-type = ["cdylib"]

[features]
default = ["gpui-component-host"]
real-gpui = ["dep:zed_gpui", "gpui_core/native-render", "dep:gpui_platform", "dep:futures", "dep:unicode-segmentation"]
desktop = ["real-gpui", "gpui_platform/font-kit", "gpui_platform/wayland", "gpui_platform/x11"]
components = ["desktop", "dep:gpui-component", "dep:gpui-component-assets", "dep:gpui_components"]
vanilla-host = ["desktop"]
gpui-component-host = ["components"]
native-test = ["gpui-component-host", "zed_gpui/test-support"]

[dependencies]
gpui_core = { path = "../../gpui/native" }
gpui_components = { path = "../../gpui_components/native", optional = true }
rustler = "0.38.0"
# gpui-component uses the unqualified Zed source. Keep these source IDs identical
# and pin the shared revision through Cargo.lock so all GPUI types are unified.
zed_gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", optional = true, features = ["runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "5c5eb1db04dc1146bdec903a8ac74407bd6c2098", optional = true }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "5c5eb1db04dc1146bdec903a8ac74407bd6c2098", optional = true }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
futures = { version = "0.3", optional = true }
unicode-segmentation = { version = "1.12", optional = true }

[dev-dependencies]
zed_gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", features = ["test-support"] }
smallvec = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
